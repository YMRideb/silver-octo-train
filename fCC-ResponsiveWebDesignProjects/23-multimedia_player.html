<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Multimedia Player</title>
    </head>

    <body>
        <h1>Main Title Placeholder</h1>
        <section>
            <h2>First song title placeholder</h2>
            <audio controls aria-label="First song placeholder aria label">
                <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
                    type="audio/mpeg">
            </audio>
        </section>
        <section>
            <h2>Second song title placeholder</h2>
            <video controls width="600" aria-label="descriptive label goes here">
                <source
                    src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
                    type="video/mp4">
                <track
                    src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
                    kind="captions" srclang="en" label="English">
            </video>
        </section>
        <section>
            <h2>Third title placeholder</h2>
            <p>Transcript</p>
        </section>

    </body>

</html>
