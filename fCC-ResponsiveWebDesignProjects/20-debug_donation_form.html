<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Donation Form</title>
    </head>

    <body>
        <h1>Donation Form</h1>
        <form>

            <label for="full-name" id="full-name">Full Name:</label>
            <input type="text" name="name" id="full-name" required />

            <label for="email-address" id="email-address">Email Address:</label>
            <input type="email" name="email-address" id="email-address" required />

            <label for="amount" id="amount">Donation Amount ($):</label>
            <input type="number" name="amount" id="amount" required>

            <input type="checkbox" name="subscribe">
            <label for="subscribe" id="subscribe">Subscribe</label>

            <input type="submit" value="Send">
        </form>
    </body>

</html>
