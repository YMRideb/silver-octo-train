<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Donation Form</title>
    </head>

    <body>
        <h1>Donation Form</h1>
        <form>

            Full Name:
            <label for="full-name" id="full-name"></label>
            <input type="text" name="full-name" required>

            Email Address:
            <label for="email-address" id="email-address"></label>
            <input type="email" name="email-address" required>

            Donation Amount ($):
            <label for="donation-amount" id="donation-amount"></label>
            <input type="number" name="donation-amount" required>

            <label for="subscriptionB" id="subscriptionB"></label>
            <input type="checkbox" name="subscriptionB">
            Subscribe

            <input type="submit" value="Send">
        </form>
    </body>

</html>
