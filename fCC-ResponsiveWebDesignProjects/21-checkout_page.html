<!-- every image on your website should have a placeholder, even if it's just a simple gray box-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title><!DOCTYPE html>
    <html lang="en">
    
        <head>
            <meta charset="UTF-8" />
            <title>Checkout Page</title>
        </head>
    
        <body>
            <h1>Checkout</h1>
            <section>
                <h2>Your Cart</h2>
                <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="A Rubik's cube opened mid-solve" />
            </section>
            <section>
                <h2>Payment Information</h2>
                <form id="payment-information">
                    <input type="text" id="card-name" name="card-name" required />
                    <label for="card-name" id="card-name">Card Name<span aria-hidden="true">*</span></label>
    
                    <input type="text" id="card-number" name="card-number" aria-describedby="card-number-help" required />
                    <p id="card-number-help">Please enter your card number to submit</p>
                    <label for="card-number" id="card_number">Card Number<span aria-hidden="true">*</span></label>
                    <p id="card-number-help">Please enter your card number to submit</p>
                </form>
            </section>
        </body>
    
    </html>
